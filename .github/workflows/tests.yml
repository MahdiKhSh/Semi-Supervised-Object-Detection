name: CPU and config validation
on:
  push:
  pull_request:
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
  config-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install config parser
        run: python -m pip install "mmengine>=0.7.1,<1"
      - name: Clone external baseline to the required location
        run: |
          git clone https://github.com/open-mmlab/mmdetection.git third_party/mmdetection
          git -C third_party/mmdetection checkout cfd5d3a985b0249de009b67d04f37263e11cdf3d
      - name: Resolve proposed MMDetection configs
        run: python scripts/check_configs.py

  torch-gradients:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU PyTorch and unit-test dependencies
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[dev]"
      - name: Check differentiable loss and autograd
        run: python -m pytest -q tests/test_consistency.py

  native-windows-path-cpu-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned CPU TorchVision pair
        run: |
          python -m pip install torch==2.10.0 torchvision==0.25.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[dev,native]"
      - name: Run native-data, native-training, CaRe/CoRe-SSOD and recovery unit tests
        run: python -m pytest -q tests/test_native_training.py tests/test_native_data.py tests/test_native_regularizer.py tests/test_coco_evaluation.py tests/test_care_ssod.py tests/test_conformal_and_baselines.py tests/test_recovery.py
      - name: Verify status and dry-run never launch training
        run: |
          python scripts/run_suite.py --preset core --status --output work_dirs/ci_status
          python scripts/run_suite.py --preset core --dry-run --output work_dirs/ci_status
          python -c "from pathlib import Path; r=Path('work_dirs/ci_status'); assert (r/'progress.json').exists(); assert not (r/'runs').exists()"
      - name: Synthetic end-to-end 1-step model / EMA / regularizer run
        run: python scripts/run_suite.py --preset smoke --device cpu --max-side 128 --warmup-steps 1 --train-steps 1 --output work_dirs/ci_smoke
      - name: Verify smoke resumability
        run: python scripts/run_suite.py --preset smoke --device cpu --max-side 128 --warmup-steps 1 --train-steps 1 --output work_dirs/ci_smoke
      - name: Synthetic core-run checks (real evaluator, reports and figures)
        run: |
          python scripts/make_synthetic_bdd.py --output work_dirs/ci_core_source
          python scripts/run_suite.py --preset core --device cpu --max-side 128 --warmup-steps 1 --train-steps 1 --run-limit 3 --train-labels work_dirs/ci_core_source/synthetic_train_labels.json --val-labels work_dirs/ci_core_source/synthetic_val_labels.json --train-images work_dirs/ci_core_source/images/train --val-images work_dirs/ci_core_source/images/val --output work_dirs/ci_core
          python -c "from pathlib import Path; r=Path('work_dirs/ci_core'); assert (r/'PAPER_RESULTS.md').exists(); assert (r/'runs/05pct_s42/supervised/analysis/conditions.json').exists(); assert (r/'runs/05pct_s42/supervised/analysis/per_class.json').exists(); assert (r/'figures/ap_05pct.png').exists(); print('All research reports generated')"

  windows-native-cpu-integration:
    runs-on: windows-latest
    timeout-minutes: 35
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install official matched Windows CPU PyTorch
        run: |
          python -m pip install torch==2.10.0 torchvision==0.25.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[dev,native]"
      - name: Check PowerShell 5.1 script parseability
        shell: powershell
        run: |
          $files = @("scripts\setup_windows.ps1","scripts\prepare_data_windows.ps1")
          foreach ($file in $files) {
              $tokens = $null
              $errors = $null
              [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file).Path, [ref]$tokens, [ref]$errors) | Out-Null
              if ($errors.Count -gt 0) { throw "$file PowerShell syntax errors: $errors" }
          }
      - name: Native Windows research unit tests
        run: python -m pytest -q
      - name: Native Windows synthetic detection pipeline
        run: python scripts/run_suite.py --preset smoke --device cpu --max-side 128 --warmup-steps 1 --train-steps 1 --output work_dirs/win_ci_smoke
