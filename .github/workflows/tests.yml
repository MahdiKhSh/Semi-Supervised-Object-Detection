name: CPU and config validation
on:
  push:
  pull_request:
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
  config-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install config parser
        run: python -m pip install "mmengine>=0.7.1,<1"
      - name: Clone external baseline to the required location
        run: git clone --depth 1 https://github.com/open-mmlab/mmdetection.git third_party/mmdetection
      - name: Resolve proposed MMDetection configs
        run: python scripts/check_configs.py
